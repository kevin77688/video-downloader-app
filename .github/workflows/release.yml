name: Release

# Pushing a tag "vX.Y.Z" (or "vX.Y.Z-rc.N" for a pre-release) builds the signed APK and publishes
# a GitHub Release. Create tags only with scripts/release.sh (see CLAUDE.md "Versioning & tags").
# Manual runs (workflow_dispatch) are a dry run: same signed build, uploaded as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # SHA-256 of the one signing certificate every release must carry (installs must update in place).
      EXPECTED_CERT_SHA256: 44c0235db6c00e987ccdc283e94c940d8f03f045f8e42ecc0dfa73d91a8e02c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches appVersion
        id: version
        run: |
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          if [ -z "$version" ]; then echo "::error::appVersion missing from gradle.properties"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersion=$version — use scripts/release.sh"
            exit 1
          fi
          case "$version" in *-rc.*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are not configured (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed APK
        run: ./gradlew assembleRelease

      - name: Verify signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with unexpected certificate: ${actual:-<unsigned>}"
            exit 1
          fi
          echo "Signature OK ($actual)"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="UniversalVideoDownloader-v$VERSION.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          ls -la dist

      - name: Upload artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 7

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Stable: the "## [X.Y.Z]" section. Pre-release: the "## [Unreleased]" section.
          section="$VERSION"
          if [ "$PRERELEASE" = "true" ]; then section="Unreleased"; fi
          awk -v h="## [$section]" 'index($0, h) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "No changelog entry for $section." > notes.md; fi
          echo "" >> notes.md
          echo "SHA-256 of the APK is in the attached \`.sha256\` file." >> notes.md
          cat notes.md

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"

      - name: Remove signing key
        if: always()
        run: rm -f keystore/release.jks keystore.properties
