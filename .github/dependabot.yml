# Dependabot version updates. Security alerts / security updates are enabled in the repo settings;
# the CI "dependency-submission" job uploads the resolved Gradle graph so alerts see transitive deps.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      androidx-compose:
        patterns: ["androidx.*", "org.jetbrains.kotlin*"]
      build-tools:
        patterns: ["com.android.*", "com.android.tools*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
